<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pitha Ghor</title>
    <style>
        form{
            background-color: lightgray;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }
        input[type="submit"],
        input[type="reset"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        fieldset {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <header>

    </header>
    <main>
         <section>
            <h1 style="text-align: center; background-color: lightgreen;">Sweet Pitha and Vorta Restaurent</h1>
            <img src="images/istockphoto-1433911467-1024x1024.jpg" width="300" alt="Pitha and Vorta ">
            <img src="images/istockphoto-2194526450-1024x1024.jpg" width="300" alt="Pitha and Vorta ">
            <img src="images/istockphoto-1139791226-1024x1024.jpg" width="300" alt="Pitha and Vorta ">

            <form>
                <label for="name">Name:</label>
                <input type="text" placeholder="Write your name">
                <br>
                <br>
                <label for="email">Email:</label>
                <input type="email" placeholder="Write your email">
                <br>
                <br>
                <label for="password">Password:</label>
                <input type="password" placeholder="Write your password">
                <br>
                <br>
                <input type="tel" placeholder="Write your phone number">
                <br>    
                <br>

                <fieldset>
                    <legend>Pitha Information</legend>
                    <br>
                    <input type="radio" name="Pitha" id="Chitoy">
                    <label for="Chitoy">Chitoy</label>
                    <br>
                    <input type="radio" name="Pitha" id="PatiShapta">
                    <label for="PatiShapta">PatiShapta</label>
                    <br>
                    <input type="radio" name="Pitha" id="BhapaPitha">
                    <label for="BhapaPitha">BhapaPitha</label>
                    <br>
                    <br>
                   
               

                </fieldset>
                <fieldset>
                    <legend>Vorta Selection</legend>
                        <br>
                        <input type="checkbox" name="Vorta" id="DimVorta">
                        <label for="DimVorta">Dim Vorta</label>
                        <br>
                        <input type="checkbox" name="Vorta" id="BegunVorta">
                        <label for="BegunVorta">Begun Vorta</label>
                        <br>
                        <input type="checkbox" name="Vorta" id="AluuVorta">
                        <label for="AluuVorta">Aluu Vorta</label>
                        <br>
                        <input type="checkbox" name="Vorta" id="sorisaVorta">
                        <label for="sorisaVorta">Sorisa Vorta</label>

                </fieldset>
                <fieldset>
                    <legend>Extra Information</legend>
                    <br>
                    <textarea cols="50" rows="10" id=""></textarea>
                </fieldset>
                <br>
                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
            </form>
         </section>

    </main>
    <footer>

    </footer>
    
</body>
</html>
